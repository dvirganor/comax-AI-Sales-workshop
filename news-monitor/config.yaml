      - {name: גולף, aliases: [גולף, "גולף אנד קו", "Golf & Co"], require_context: true}
      - {name: דלתא גליל, aliases: ["דלתא גליל", "Delta Galil"]}
      - {name: H&O, aliases: ["H&O"]}
      - {name: רנואר, aliases: [רנואר, Renuar]}
